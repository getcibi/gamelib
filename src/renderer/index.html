<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' art: data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>gamelib</title>
    <link rel="icon" href="branding/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body data-style="disc">
    <!-- 光盘托盘下面那张印刷品的双色调（深蓝 → 浅蓝） -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="duo-disc" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values=".0708 .2382 .0240 0 .0275
                  .0967 .3254 .0329 0 .0706
                  .1535 .5164 .0521 0 .1804
                  0 0 0 1 0"
        />
      </filter>
    </svg>

    <header id="top" hidden>
      <h1><img src="branding/icon.svg" width="34" height="34" alt="" />gamelib</h1>
      <span id="count"></span>
      <button id="chip" class="chip" hidden></button>
      <div class="spacer"></div>
      <div class="top-controls">
        <button id="dash-btn" title="数据面板（D）" data-i18n-title="dashboardShortcut">
          <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg><span data-i18n="dashboard">数据面板</span>
        </button>
        <div class="seg" id="filter">
          <button data-v="all" data-i18n="all">全部</button>
          <button data-v="installed" data-i18n="installed">已安装</button>
        </div>
        <div class="seg" id="style-seg">
          <button data-v="disc">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="2.4" /></svg><span data-i18n="discCases">光盘盒</span>
          </button>
          <button data-v="card">
            <svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z" /><path d="M9 7h6" /></svg><span data-i18n="cardCases">卡带盒</span>
          </button>
        </div>
        <button class="icon" id="settings-btn" title="设置" data-i18n-title="settings">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
            />
          </svg>
        </button>
        <button class="icon" id="reload-btn" title="重新读取" data-i18n-title="reload">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7" /><path d="M20 4v7h-7" /></svg>
        </button>
      </div>
    </header>

    <main id="shelf"></main>
    <footer id="info"></footer>

    <div id="loading">
      <div class="bar"><i></i></div>
      <p>正在启动…</p>
    </div>

    <dialog id="settings">
      <form method="dialog">
        <h2 data-i18n="settings">设置</h2>
        <label>
          <span data-i18n="language">界面语言</span>
          <select id="f-language">
            <option value="zh-CN" lang="zh-CN">简体中文</option>
            <option value="en" lang="en">English</option>
          </select>
        </label>
        <p class="dim small" data-i18n="settingsIntro">填写 Web API Key 后，保存即可同步所选账号并更新数据面板。</p>
        <button type="button" class="link" id="apikey-link" data-i18n="getKey">去 Steam 申请 Key ↗</button>
        <label>
          <span>Web API Key</span>
          <div class="field">
            <input id="f-key" type="password" autocomplete="off" spellcheck="false" />
            <button type="button" id="f-key-eye" title="显示或隐藏 Key" data-i18n-title="showHideKey">👁</button>
          </div>
        </label>
        <label>
          <span data-i18n="statisticsAccount">统计账号</span>
          <select id="f-account"></select>
          <small id="f-id-help" class="dim"></small>
        </label>
        <label id="f-id-row" hidden>
          <span>SteamID64</span>
          <input id="f-id" autocomplete="off" inputmode="numeric" pattern="[0-9]{17}" disabled />
        </label>
        <p class="dim small" id="f-where"></p>
        <div class="actions">
          <button type="button" id="settings-cancel" data-i18n="cancel">取消</button>
          <button type="submit" value="save" class="primary" data-i18n="saveSync">保存并同步</button>
        </div>
      </form>
    </dialog>

    <div id="toast" role="status"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
